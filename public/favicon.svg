<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Swiss Modernist Dark Badge -->
  <rect width="120" height="120" rx="26" fill="#121212"/>
  
  <!-- Subtle border definition -->
  <rect x="1.5" y="1.5" width="117" height="117" rx="24.5" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Monogram OD: Geometric & Architectural -->
  <g fill="none" stroke="#F5F3EC" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter O (Bold Geometric Ring) -->
    <ellipse cx="44" cy="60" rx="19" ry="22" stroke-width="8.5"/>
    
    <!-- Letter D (Stem & Geometric Arc) -->
    <path d="M 64 38 V 82" stroke-width="8.5"/>
    <path d="M 64 38 C 84 38 89 48 89 60 C 89 72 84 82 64 82" stroke-width="8.5"/>
  </g>

  <!-- Swiss Red Accent Dot (Data & Spark) -->
  <circle cx="89" cy="36" r="4.5" fill="#D84227"/>
</svg>
